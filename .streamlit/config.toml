# Theme for app.py (the interactive demo -- see README.md "Interactive
# demo"). One considered palette, one accent colour used consistently
# throughout the page; the only exception is the feature-contribution
# chart, where a second colour encodes a genuinely signed quantity
# (DECISIONS.md D32). Not used by run.sh or any src/ script -- this file
# only affects `streamlit run app.py`.

[theme]
base = "light"
primaryColor = "#2F6F8F"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1F24"
grayTextColor = "#646B78"
linkColor = "#2F6F8F"
borderColor = "#E1DFD8"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.375rem", "1.05rem"]
headingFontWeights = [700, 650, 600]
metricValueFontSize = "2.1rem"
metricValueFontWeight = 700
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
